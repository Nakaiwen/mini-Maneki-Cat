<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mini 招財貓求籤 · 小六太乙</title>
<style>
  :root{
    --paper:#faf6ef;
    --ink:#3d3630;
    --ink-soft:#7a7168;
    --goldbrown:#A6791F;
    --line:#e5dccd;
    --accent:#A6791F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; }
  html{ overflow-x:clip; }
  body{
    font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
    color:var(--ink);
    display:flex; justify-content:center;
    padding:4px 2px;
  }
  .card{
    width:100%; max-width:410px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px 16px;
    text-align:center;
  }
  h1{ font-size:19px; font-weight:700; letter-spacing:.12em; margin-bottom:2px; }
  .sub{ font-size:12px; color:var(--ink-soft); letter-spacing:.06em; min-height:18px; }

  /* ---------- 招財貓 ---------- */
  .cat{
    position:relative; width:min(240px, 68vw); aspect-ratio:1; margin:8px auto 4px;
    isolation:isolate;
  }
  .cat img{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; user-select:none; -webkit-user-drag:none;
  }
  .cat .body{ z-index:2; }
  .cat .arm{ z-index:1; transform-origin:83.18% 60.13%; will-change:transform; backface-visibility:hidden; }
  .paw{
    position:absolute; left:73.5%; top:14%; width:24.4%; height:23.4%;
    min-width:44px; min-height:44px;
    border:0; border-radius:48%; background:transparent; z-index:5;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .paw:disabled{ cursor:default; }
  .paw:not(:disabled):hover{ box-shadow:0 0 0 1.5px #a6791f66, 0 0 16px #a6791f33; }
  .paw:focus-visible{ outline:2px solid var(--goldbrown); outline-offset:2px; }
  .tip{
    position:absolute; right:-26px; top:-4px; z-index:6;
    font-size:11px; letter-spacing:.06em; color:var(--goldbrown);
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:3px 9px; pointer-events:none; transition:opacity .25s;
  }
  .busy .tip, .done .tip{ opacity:0; }
  .dots{ display:flex; gap:7px; justify-content:center; height:6px; margin:4px 0 8px; visibility:hidden; }
  .busy .dots{ visibility:visible; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .dots i{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s; }
  .dots i.on{ background:var(--goldbrown); }

  /* ---------- 輸入區 ---------- */
  textarea{
    display:block; width:100%; height:58px; resize:none;
    font-family:inherit; font-size:13px; line-height:1.6; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; text-align:left;
  }
  textarea::placeholder{ color:#aaa196; }
  textarea:focus{ outline:none; border-color:var(--goldbrown); }
  .hint{ font-size:10.5px; color:var(--ink-soft); margin-top:9px; letter-spacing:.05em; line-height:1.7; }

  /* ---------- 結果區 ---------- */
  #result{ animation:fadein .5s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .stemline{ font-size:12px; color:var(--ink-soft); letter-spacing:.2em; margin-bottom:2px; }
  .master{ font-size:26px; font-weight:700; letter-spacing:.12em; color:var(--accent); }
  .grade{
    display:inline-block; font-size:12px; letter-spacing:.2em; color:var(--goldbrown);
    border:1px solid #d9c49c; border-radius:999px; padding:1px 10px 1px 12px; margin:4px 0 10px;
  }
  .poem{ font-size:17px; line-height:2; letter-spacing:.14em; white-space:pre-line; }
  .src{ font-size:10px; color:var(--ink-soft); margin:6px 0 10px; letter-spacing:.05em; }
  .src a{ color:var(--goldbrown); text-underline-offset:2px; }
  .echo{
    font-size:12px; line-height:1.7; color:var(--ink-soft); text-align:left;
    overflow-wrap:anywhere; white-space:pre-wrap; max-height:66px; overflow:auto;
    border-top:1px solid var(--line); padding-top:8px; margin-bottom:10px;
  }
  .care{
    font-size:12px; line-height:1.7; background:#fff;
    border:1px dashed var(--line); border-radius:10px;
    padding:10px 10px 9px; margin-bottom:12px;
  }
  .care-title{ color:var(--accent); font-weight:700; letter-spacing:.12em; margin-bottom:6px; }
  .tones{ display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .tones label{
    font-size:11.5px; color:var(--ink-soft); cursor:pointer;
    border:1px solid var(--line); border-radius:999px; padding:3px 11px;
  }
  .tones input{ position:absolute; opacity:0; pointer-events:none; }
  .tones label:has(input:checked){ color:var(--goldbrown); border-color:var(--goldbrown); background:#fbf4e6; }
  .tones label:has(input:focus-visible){ outline:2px solid var(--goldbrown); outline-offset:2px; }
  button.go{
    font-family:inherit; font-size:13.5px; letter-spacing:.18em;
    color:#fff; background:var(--goldbrown);
    border:none; border-radius:999px;
    padding:8px 20px 8px 23px; cursor:pointer; transition:opacity .2s;
  }
  button.go:hover{ opacity:.88; }
  button.go:disabled{ opacity:.6; cursor:wait; }
  .links{ font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .links a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); margin:0 3px; }
  .links a:hover{ color:var(--goldbrown); border-color:var(--goldbrown); }
  .status{ font-size:11px; color:var(--goldbrown); min-height:17px; margin-top:4px; }
  .again{
    font-family:inherit; font-size:12px; letter-spacing:.15em;
    color:var(--ink-soft); background:none;
    border:1px solid var(--line); border-radius:999px;
    padding:5px 16px; cursor:pointer;
  }
  .again:hover{ color:var(--goldbrown); border-color:var(--goldbrown); }
  .coffee{ display:inline-block; font-size:11px; color:var(--ink-soft); margin-top:10px; text-decoration:none; }
  .coffee:hover{ color:var(--goldbrown); }
  .err{ font-size:12px; line-height:1.7; color:#9f342a; margin-top:8px; }
  .foot{ font-size:10px; color:var(--ink-soft); letter-spacing:.12em; margin-top:12px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){
    #result{ animation:none; } .dots i{ transition:none; }
  }
</style>
</head>

var SELF_TEST = [
  [1,  '大吉', '巍巍獨步向雲間'],
  [3,  '中吉', '衣食自然生處有'],
  [69, '下下', '捨舟遵路總相宜'],
  [100,'上上', '我本天仙雷雨師']
];
var ENGINE_OK = Array.isArray(LOTS) && LOTS.length === 100 &&
  LOTS.every(function(p){
    return Array.isArray(p) && p.length === 5 && typeof p[0] === 'string' && p[0].length > 0 &&
      p.slice(1).every(function(s){ return typeof s === 'string' && Array.from(s).length === 7; });
  }) &&
  SELF_TEST.every(function(t){ var p = LOTS[t[0]-1]; return p[0] === t[1] && p[1] === t[2]; }) &&
  !!(window.crypto && crypto.getRandomValues);

function drawNumber(){
  var buf = new Uint32Array(1), max = 4294967200; // 100 的最大整倍數，去除取模偏差
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % 100 + 1;
}

/* ---------- UI ---------- */
function $(id){ return document.getElementById(id); }
var card = $('card'), cat = $('cat'), arm = $('arm'), paw = $('paw'), dots = $('dots').children;
var state = 'idle', cast = null;
var SUB_IDLE = '心裡想著一件事，點一下貓咪的手';

function setState(next){
  state = next;
  card.classList.toggle('busy', next === 'drawing');
  card.classList.toggle('done', next === 'result');
  $('input').hidden = next === 'result';
  $('result').hidden = next !== 'result';
  $('question').disabled = next === 'drawing';
  paw.disabled = next !== 'idle' || !ENGINE_OK;
  paw.setAttribute('aria-busy', String(next === 'drawing'));
}

async function wave(){
  if (state !== 'idle' || !ENGINE_OK) return;
  var question = $('question').value.trim();
  var date = new Intl.DateTimeFormat('zh-TW', {timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'}).format(new Date());
  setState('drawing');
  $('sub').textContent = '招手中，請稍等一下';
  $('live').textContent = '招手中，請稍等一下';
  for (var k = 0; k < 3; k++) dots[k].classList.remove('on');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var P = 'perspective(' + Math.round(cat.clientWidth * 1.63) + 'px) ';
  try {
    for (var i = 0; i < 3; i++){
      dots[i].classList.add('on');
      await arm.animate(reduced ? [
        {transform:P + 'rotateX(0deg)'}, {transform:P + 'rotateX(-8deg)'}, {transform:P + 'rotateX(0deg)'}
      ] : [
        {transform:P + 'rotateX(0deg)', offset:0},
        {transform:P + 'rotateX(-57deg)', offset:.44},
        {transform:P + 'rotateX(16deg)', offset:.80},
        {transform:P + 'rotateX(0deg)', offset:1}
      ], {duration: reduced ? 180 : 920, easing:'ease-in-out'}).finished;
    }
    var n = drawNumber();
    cast = Object.freeze({ id:n, lot:LOTS[n-1], question:question, date:date });
    $('number').textContent = '第 ' + n + ' 籤';
    $('grade').textContent = cast.lot[0];
    $('poem').textContent = cast.lot.slice(1).join('\n');
    $('srcLink').href = SRC_BASE + n;
    $('echo').textContent = question ? '這次想問：' + question : '沒有寫下問題，可以先讀籤詩，再向 AI 補充想問的事。';
    $('copy').textContent = '複製解籤提示'; $('status').textContent = '';
    $('sub').textContent = '';
    $('live').textContent = '你求到了第 ' + n + ' 籤，' + cast.lot[0];
    setState('result');
    for (var j = 0; j < 3; j++) dots[j].classList.remove('on');
  } catch (e){
    setState('idle');
    $('sub').textContent = '招手暫停了，再點一下貓咪的手';
  }
}

async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch (e){}
  var box = document.createElement('textarea'), prev = document.activeElement;
  box.value = text; box.setAttribute('readonly', ''); box.tabIndex = -1;
  box.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;font-size:16px;';
  try { document.body.appendChild(box); box.focus({preventScroll:true}); box.select(); box.setSelectionRange(0, text.length); return document.execCommand('copy'); }
  catch (e){ return false; }
  finally { box.remove(); if (prev && prev.focus) prev.focus({preventScroll:true}); }
}

$('copy').addEventListener('click', async function(){
  if (!cast) return;
  var target = cast, btn = $('copy');
  var tone = document.querySelector('input[name="tone"]:checked').value;
  btn.disabled = true;
  var ok = await copyText(buildPrompt(cast, tone));
  btn.disabled = false;
  if (cast !== target) return;
  if (ok){ btn.textContent = '已複製 ✓'; $('status').textContent = '打開你慣用的 AI，貼上就可以'; }
  else { $('status').textContent = '沒有複製成功，請確認瀏覽器允許剪貼簿後再試一次'; }
});
document.querySelectorAll('input[name="tone"]').forEach(function(el){
  el.addEventListener('change', function(){ $('copy').textContent = '複製解籤提示'; $('status').textContent = ''; });
});
paw.addEventListener('click', wave);
$('again').addEventListener('click', function(){
  cast = null; $('question').value = '';
  setState('idle'); $('sub').textContent = SUB_IDLE;
});

/* ---------- iframe 自動高度 ---------- */
(function(){
  if (window.parent === window) return;
  var last = 0;
  function post(){
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h !== last){ last = h; window.parent.postMessage({ type:'mini-maneki:height', height:h }, '*'); }
  }
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
  window.addEventListener('load', post);
})();

setState('idle');
if (!ENGINE_OK){
  paw.disabled = true;
  $('err').hidden = false;
  $('err').textContent = '籤庫自檢沒有通過，已停用抽籤。請重新整理頁面；若持續發生，請與站長聯繫。';
  $('sub').textContent = '暫時無法求籤';
}
Object.defineProperty(window, 'manekiState', { get:function(){ return { state:state, ok:ENGINE_OK }; } });
</script>
